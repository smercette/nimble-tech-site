<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Nimble Tech, message received</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0f0e0d;
  --ink-mid: #4a4845;
  --ink-light: #9a9690;
  --paper: #faf9f7;
  --paper-warm: #f3f1ec;
  --paper-mid: #e8e4dc;
  --accent: #1a2a44;
  --accent-light: #2d4a78;
  --accent-pale: #e8edf5;
  --accent-border: #c2cfe3;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 10px;
  --radius-lg: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 60px;
  background: rgba(250,249,247,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--paper-mid);
}

.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-mark {
  width: 30px; height: 30px; background: var(--accent); border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
}
.nav-mark span { color: #fff; font-size: 12px; font-family: var(--mono); font-weight: 500; }
.nav-name { font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }

.nav-links { display: flex; align-items: center; gap: 2rem; }
.nav-links a { font-size: 14px; color: var(--ink-mid); text-decoration: none; transition: color 0.15s; }
.nav-links a:hover { color: var(--ink); }

/* CONTENT */
.content {
  max-width: 700px; margin: 0 auto;
  padding: 120px 2rem 80px;
}

h1 {
  font-family: var(--serif);
  font-size: clamp(2rem, 5vw, 2.8rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 0.5rem;
  text-align: center;
}

.subtitle {
  font-size: 16px;
  color: var(--ink-mid);
  margin-bottom: 3rem;
  text-align: center;
  line-height: 1.6;
}

/* FOOTER */
footer {
  background: var(--ink);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 2rem;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.35);
}

footer a {
  color: rgba(255,255,255,0.5);
  text-decoration: none;
}

footer a:hover { color: rgba(255,255,255,0.8); }

/* RESPONSIVE */
@media (max-width: 768px) {
  .nav-links { display: none; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-mark"><span>NT</span></div>
    <span class="nav-name">Nimble Tech</span>
  </a>
  <div class="nav-links">
    <a href="index.html#mission">Mission</a>
    <a href="index.html#pass">Nimble Pass</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<div class="content">
  <h1>Success.</h1>
  <p class="subtitle">We'll be in touch.</p>
</div>

<footer>
  <p>Nimble Tech &nbsp;·&nbsp; <a href="privacy.html">Privacy policy</a> &nbsp;·&nbsp; <a href="terms.html">Terms</a> &nbsp;·&nbsp; <a href="sub-processors.html">Sub-processors</a> &nbsp;·&nbsp; <a href="contact.html">Contact</a></p>
  <p style="margin-top:6px;">© 2026 Nimble Tech Ltd. All rights reserved.</p>
  <p style="margin-top:6px; color: rgba(255,255,255,0.25);">Nimble Tech Ltd is registered in England and Wales (company no. 16203504).</p>
</footer>

</body>
</html>
